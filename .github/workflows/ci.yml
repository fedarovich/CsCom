# Builds the solution and runs the unit tests for every push and pull request. A tag with a semantic version, e.g. 1.2.3 or
# 1.2.3-beta.1, sets the version of the packages and pushes them to nuget.org with trusted publishing.
name: CI

on:
  push:
    branches: ['**']
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:

permissions:
  contents: read

# A newer push cancels the build of the same branch, but a release is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Verify must not open a diff tool for the snapshots that do not match.
  DiffEngine_Disabled: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    # The tool reads type libraries with the OLE Automation APIs, so it only runs on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The glob patterns of the trigger also match tags like 01.2.3, which are not semantic versions.
      - name: Get the version from the tag
        if: github.ref_type == 'tag'
        run: |
          $version = $env:GITHUB_REF_NAME
          if ($version -cnotmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            Write-Output "::error::The tag '$version' is not a semantic version such as 1.2.3 or 1.2.3-beta.1."
            exit 1
          }
          "CSCOM_VERSION=$version" >> $env:GITHUB_ENV

      # The build also creates the CsCom.Runtime and CsCom.Build packages in artifacts/packages.
      - name: Build
        run: |
          $properties = @('-p:ContinuousIntegrationBuild=true')
          if ($env:CSCOM_VERSION) { $properties += "-p:Version=$env:CSCOM_VERSION" }
          dotnet build src/CsCom.slnx -c Release @properties

      - name: Run the unit tests
        run: dotnet test src/CsCom.slnx -c Release --no-build --filter "TestCategory!=Integration" --logger trx --results-directory TestResults

      - name: Pack the tool
        run: |
          $properties = @('-p:ContinuousIntegrationBuild=true')
          if ($env:CSCOM_VERSION) { $properties += "-p:Version=$env:CSCOM_VERSION" }
          dotnet pack src/CsCom/CsCom.csproj -c Release -o artifacts/packages @properties

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            src/**/*.received.*
          if-no-files-found: ignore

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    # Only this job can request the OIDC token that nuget.org exchanges for a short-lived API key.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The trusted publishing policy on nuget.org trusts this workflow file (ci.yml) of fedarovich/CsCom.
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # A re-run after a partial push skips the packages that were pushed.
      - name: Push the packages
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
